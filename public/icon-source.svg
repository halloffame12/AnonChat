<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Primary brand gradient: purple → coral -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cbf"/>
      <stop offset="100%" stop-color="#5b3d9e"/>
    </linearGradient>

    <!-- Ghost body gradient (light) -->
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#ede8f8" stop-opacity="0.93"/>
    </linearGradient>

    <!-- Accent for finger -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4a98d"/>
      <stop offset="100%" stop-color="#e07a5f"/>
    </linearGradient>

    <!-- Soft drop shadow glow -->
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: primary purple gradient (matches site buttons) -->
  <rect width="512" height="512" rx="116" fill="url(#brandGrad)"/>

  <!-- Subtle inner shine on background -->
  <rect x="0" y="0" width="512" height="256" rx="116"
        fill="#ffffff" fill-opacity="0.07"/>

  <!-- Border: soft white ring for depth -->
  <rect x="8" y="8" width="496" height="496" rx="109"
        fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.15"/>

  <!-- ── Speech Bubble ── -->
  <!-- Bubble glow/shadow -->
  <path d="M256 95 C150 95 87 157 87 228 C87 287 128 336 191 358 L174 424 L248 384 C250 385 253 385 256 385 C362 385 425 323 425 228 C425 157 362 95 256 95Z"
        fill="#ffffff" fill-opacity="0.12" filter="url(#softGlow)"/>

  <!-- Bubble fill — crisp white -->
  <path d="M256 103 C153 103 95 163 95 228 C95 284 134 331 196 353 L179 416 L250 378 C252 379 254 379 256 379 C359 379 417 319 417 228 C417 163 359 103 256 103Z"
        fill="#ffffff" fill-opacity="0.97"/>

  <!-- Bubble subtle tint -->
  <path d="M256 103 C153 103 95 163 95 228 C95 284 134 331 196 353 L179 416 L250 378 C252 379 254 379 256 379 C359 379 417 319 417 228 C417 163 359 103 256 103Z"
        fill="url(#brandGrad)" fill-opacity="0.05"/>

  <!-- ── Ghost Body ── -->
  <path d="M256 152
           C213 152 178 183 178 224
           L178 302
           L195 289 L213 302 L231 289 L249 302 L267 289 L285 302 L303 289 L321 302
           L321 224
           C321 183 299 152 256 152Z"
        fill="url(#brandGrad)" fill-opacity="0.88"/>

  <!-- Ghost highlight sheen -->
  <ellipse cx="236" cy="178" rx="21" ry="11"
           fill="#ffffff" fill-opacity="0.25"
           transform="rotate(-18,236,178)"/>

  <!-- Ghost eyes — white sclera -->
  <ellipse cx="231" cy="213" rx="14" ry="16" fill="#ffffff"/>
  <ellipse cx="281" cy="213" rx="14" ry="16" fill="#ffffff"/>
  <!-- Pupils: primary-dark -->
  <circle cx="234" cy="211" r="7" fill="#5b3d9e"/>
  <circle cx="284" cy="211" r="7" fill="#5b3d9e"/>
  <!-- Eye shine -->
  <circle cx="237" cy="208" r="3" fill="#ffffff"/>
  <circle cx="287" cy="208" r="3" fill="#ffffff"/>

  <!-- ── Shush Finger (accent coral) ── -->
  <!-- Finger shaft -->
  <rect x="247" y="234" width="18" height="44" rx="9" fill="url(#accentGrad)"/>
  <!-- Fingertip highlight -->
  <ellipse cx="256" cy="234" rx="9" ry="8" fill="#f4a98d"/>
  <!-- Knuckle/hand base -->
  <ellipse cx="256" cy="277" rx="21" ry="12" fill="url(#accentGrad)"/>
</svg>
